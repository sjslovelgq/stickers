name: Build sticker catalog

on:
  push:
    branches:
      - main
    paths:
      - "stickers/**"
      - "categories.json"
      - "scripts/build-catalog.mjs"
      - ".github/workflows/build-sticker-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sticker-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sticker-catalog.json
        env:
          IMAGE_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.event.repository.default_branch }}/stickers/
        run: node scripts/build-catalog.mjs

      - name: Commit updated catalog
        id: commit
        shell: bash
        run: |
          git add sticker-catalog.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update sticker catalog"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr cache
        if: success()
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          BASE="https://purge.jsdelivr.net/gh/${REPOSITORY}@${BRANCH}"
          curl --fail --silent --show-error "${BASE}/sticker-catalog.json" || true

          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            FILES="$(git diff --name-only "$BEFORE" "$AFTER" -- 'stickers/**' || true)"
          else
            FILES="$(git diff-tree --no-commit-id --name-only -r "$AFTER" -- 'stickers/**' || true)"
          fi

          while IFS= read -r FILE; do
            [[ -z "$FILE" ]] && continue
            ENCODED="$(node -e 'console.log(encodeURI(process.argv[1]))' "$FILE")"
            echo "Purging ${FILE}"
            curl --fail --silent --show-error "${BASE}/${ENCODED}" || true
          done <<< "$FILES"
